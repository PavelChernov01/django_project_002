<!DOCTYPE html>
<html>
<head>
    <title>Удаление комментария</title>
    <meta charset="utf-8">
</head>
<body>
    <h1>Удаление комментария</h1>
    <p>Вы уверены, что хотите удалить этот комментарий?</p>
    <p><strong>{{ comment.text }}</strong></p>
    <p><em>Автор: {{ comment.author.first_name }} {{ comment.author.last_name }}</em></p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{% url 'task_detail' comment.task.id %}">Отмена</a>
    </form>
</body>
</html>
