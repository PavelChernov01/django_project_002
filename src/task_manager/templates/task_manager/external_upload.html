<!DOCTYPE html>
<html>
<head>
    <title>Загрузка файла из внешнего пути</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; max-width: 400px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .success { color: green; padding: 10px; background: #d4edda; border-radius: 4px; margin-bottom: 20px; }
        .error { color: red; padding: 10px; background: #f8d7da; border-radius: 4px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Загрузка файла из внешнего пути</h1>

    {% if messages %}
        {% for message in messages %}
            <div class="{% if message.tags == 'error' %}error{% else %}success{% endif %}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Задача:</label>
            <select name="task_id" required>
                <option value="">Выберите задачу</option>
                {% for task in tasks %}
                    <option value="{{ task.id }}">{{ task.title }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>URL файла:</label>
            <input type="url" name="url" placeholder="https://example.com/file.pdf" required>
        </div>
        <button type="submit">Сохранить</button>
    </form>

    <p><a href="/attachments/">Назад к списку вложений</a></p>
</body>
</html>
