<!DOCTYPE html>
<html>
<head>
    <title>Создание задачи (кастомные виджеты)</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; max-width: 500px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        textarea { width: 100%; max-width: 600px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: Arial;}
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .success { color: green; padding: 10px; background: #d4edda; border-radius: 4px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Создание задачи (кастомные виджеты)</h1>

    {% if messages %}
        {% for message in messages %}
            <div class="success">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>{{ form.title.label }}:</label>
            {{ form.title }}
        </div>

        <div class="form-group">
            <label>{{ form.description.label }}:</label>
            {{ form.description }}
        </div>

        <div class="form-group">
            <label>{{ form.priority.label }}:</label>
            {{ form.priority }}
        </div>

        <div class="form-group">
            <label>{{ form.status.label }}:</label>
            {{ form.status }}
        </div>

        <button type="submit">Создать задачу</button>
    </form>

    <p><a href="/">На главную</a></p>
</body>
</html>
